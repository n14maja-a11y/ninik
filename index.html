<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9efee; --panel:#ffffff; --ink:#15302b; --muted:#5d7570; --line:#cfdbd8;
  --brand:#0f766e; --brand-dark:#0a4f4a; --hl:#f2c14e; --danger:#b3261e;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

header{background:var(--brand-dark);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
header h1{margin:0;font-size:1.25rem;font-weight:800}
nav{display:flex;gap:6px}
nav button{background:transparent;color:#cfe8e4;border:2px solid transparent;border-radius:8px;padding:8px 16px;font-weight:600}
nav button[aria-selected="true"]{background:#fff;color:var(--brand-dark)}

main{max-width:1100px;margin:0 auto;padding:20px}
.view{display:none}
.view.active{display:block}

.kasir{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{margin:0 0 12px;font-size:1.05rem}

.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{text-align:left;background:#f6faf9;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.item:hover{border-color:var(--brand);background:#fff}
.item b{font-weight:600}
.item span{font-family:var(--mono);color:var(--brand-dark);font-weight:600;margin-top:auto}

.cart{position:sticky;top:12px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600}
.line .sub{font-family:var(--mono);text-align:right}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:800}
.qty .x{width:auto;border:0;background:none;color:var(--danger);font-size:.85rem;font-weight:600}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px;font-weight:800}
.total strong{font-family:var(--mono);font-size:1.5rem}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.change{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono)}
.msg{min-height:1.4em;color:var(--danger);font-size:.85rem;margin-top:6px}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:800;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-dark)}
.btn.light{background:#e3ecea;color:var(--ink)}
.btn.light:hover{background:#d3e0dd}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.add-form{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end}
.add-form label{margin:0 0 4px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;font-size:.85rem;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}
td input{padding:8px 10px}
.del{background:none;border:0;color:var(--danger);font-weight:600}

/* Struk */
.overlay{position:fixed;inset:0;background:rgba(10,30,28,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:10}
.overlay.open{display:flex}
.sheet{background:#fff;width:100%;max-width:340px;padding:20px 18px;font-family:var(--mono);font-size:.82rem;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.sheet h3{margin:0;text-align:center;font-family:var(--sans);font-size:1.1rem}
.sheet .c{text-align:center;color:var(--muted)}
.sheet hr{border:0;border-top:1px dashed #333;margin:10px 0}
.sheet .r{display:flex;justify-content:space-between;gap:8px}
.sheet .it{margin-bottom:6px}
.sheet .it .r span:first-child{overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:14px;font-family:var(--sans)}
.actions .btn{flex:1}

@media (max-width:820px){
  .kasir{grid-template-columns:1fr}
  .cart{position:static}
  .add-form{grid-template-columns:1fr}
}
@media print{
  body>*:not(#overlay){display:none!important}
  .overlay{position:static;display:block!important;background:none;padding:0}
  .sheet{box-shadow:none;max-width:100%;padding:0}
  .actions{display:none!important}
}
</style>
</head>
<body>

<header>
  <h1 id="judulToko">Warung Saya</h1>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-view="kasir">Kasir</button>
    <button role="tab" aria-selected="false" data-view="kelola">Kelola menu</button>
  </nav>
</header>

<main>
  <!-- KASIR -->
  <section id="kasir" class="view active">
    <div class="kasir">
      <div class="panel">
        <h2>Pilih menu</h2>
        <input class="search" id="cari" type="search" placeholder="Cari menu…" aria-label="Cari menu">
        <div class="items" id="daftarMenu"></div>
      </div>

      <div class="panel cart">
        <h2>Pesanan</h2>
        <div id="keranjang"></div>
        <div class="total"><span>Total</span><strong id="total">Rp 0</strong></div>
        <label for="bayar">Uang diterima (Rp)</label>
        <div class="row">
          <input type="number" id="bayar" min="0" inputmode="numeric" placeholder="0">
          <button class="btn light" id="pas" type="button">Uang pas</button>
        </div>
        <div class="change"><span>Kembalian</span><span id="kembali">Rp 0</span></div>
        <div class="msg" id="pesan" role="alert"></div>
        <button class="btn block" id="cetak" type="button">Cetak struk</button>
        <button class="btn light block" id="kosongkan" type="button">Kosongkan pesanan</button>
      </div>
    </div>
  </section>

  <!-- KELOLA MENU -->
  <section id="kelola" class="view">
    <div class="panel" style="margin-bottom:20px">
      <h2>Nama toko</h2>
      <input type="text" id="namaToko" aria-label="Nama toko">
    </div>

    <div class="panel" style="margin-bottom:20px">
      <h2>Tambah menu</h2>
      <form class="add-form" id="formTambah" autocomplete="off">
        <div><label for="nm">Nama menu</label><input type="text" id="nm" required placeholder="Contoh: Nasi Goreng"></div>
        <div><label for="hg">Harga (Rp)</label><input type="number" id="hg" required min="0" step="100" placeholder="15000"></div>
        <button class="btn" type="submit">Tambah menu</button>
      </form>
    </div>

    <div class="panel">
      <h2>Daftar menu</h2>
      <div id="tabelWrap"></div>
    </div>
  </section>
</main>

<!-- STRUK -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Struk belanja">
  <div>
    <div class="sheet" id="sheet"></div>
    <div class="actions">
      <button class="btn" id="btnPrint" type="button">Cetak</button>
      <button class="btn light" id="btnSelesai" type="button">Selesai</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let menu = load('kasir_menu', [
  {id:1, nama:'Nasi Goreng', harga:18000},
  {id:2, nama:'Mie Ayam',    harga:15000},
  {id:3, nama:'Es Teh',      harga:5000},
  {id:4, nama:'Kopi Susu',   harga:12000}
]);
let toko  = load('kasir_toko', 'Warung Saya');
let nomor = load('kasir_nomor', 1);
let cart  = {};   // id menu -> jumlah

const total = () => menu.reduce((t, m) => t + (cart[m.id] || 0) * m.harga, 0);

/* ---------- Tab ---------- */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === b.dataset.view));
}));

/* ---------- Kasir ---------- */
function renderMenu(){
  const q = $('#cari').value.trim().toLowerCase();
  const list = menu.filter(m => m.nama.toLowerCase().includes(q));
  $('#daftarMenu').innerHTML = list.length
    ? list.map(m => `<button class="item" data-id="${m.id}"><b>${esc(m.nama)}</b><span>${rp(m.harga)}</span></button>`).join('')
    : '<div class="empty">Menu tidak ditemukan. Tambahkan di tab Kelola menu.</div>';
}

function renderCart(){
  const rows = menu.filter(m => cart[m.id]);
  $('#keranjang').innerHTML = rows.length ? rows.map(m => `
    <div class="line">
      <span class="nm">${esc(m.nama)}</span>
      <span class="sub">${rp(m.harga * cart[m.id])}</span>
      <div class="qty">
        <button data-act="min" data-id="${m.id}" aria-label="Kurangi ${esc(m.nama)}">−</button>
        <span>${cart[m.id]}</span>
        <button data-act="plus" data-id="${m.id}" aria-label="Tambah ${esc(m.nama)}">+</button>
        <button class="x" data-act="del" data-id="${m.id}">Hapus</button>
      </div>
      <span></span>
    </div>`).join('') : '<div class="empty">Belum ada pesanan. Pilih menu di sebelah kiri.</div>';
  $('#total').textContent = rp(total());
  hitungKembali();
}

function hitungKembali(){
  const k = Number($('#bayar').value || 0) - total();
  $('#kembali').textContent = rp(k > 0 ? k : 0);
}

$('#daftarMenu').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const id = Number(b.dataset.id);
  cart[id] = (cart[id] || 0) + 1;
  $('#pesan').textContent = '';
  renderCart();
});

$('#keranjang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = Number(b.dataset.id);
  if (b.dataset.act === 'plus') cart[id]++;
  if (b.dataset.act === 'min')  { cart[id]--; if (cart[id] <= 0) delete cart[id]; }
  if (b.dataset.act === 'del')  delete cart[id];
  renderCart();
});

$('#cari').addEventListener('input', renderMenu);
$('#bayar').addEventListener('input', hitungKembali);
$('#pas').addEventListener('click', () => { $('#bayar').value = total(); hitungKembali(); });
$('#kosongkan').addEventListener('click', () => { cart = {}; $('#bayar').value = ''; $('#pesan').textContent = ''; renderCart(); });

/* ---------- Struk ---------- */
$('#cetak').addEventListener('click', () => {
  const t = total(), bayar = Number($('#bayar').value || 0);
  if (!t) { $('#pesan').textContent = 'Pilih minimal satu menu dulu.'; return; }
  if (bayar < t) { $('#pesan').textContent = 'Uang diterima kurang ' + rp(t - bayar) + '.'; return; }
  $('#pesan').textContent = '';

  const tgl = new Date().toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'});
  const baris = menu.filter(m => cart[m.id]).map(m => `
    <div class="it">
      <div>${esc(m.nama)}</div>
      <div class="r"><span>${cart[m.id]} x ${Number(m.harga).toLocaleString('id-ID')}</span><span>${Number(m.harga * cart[m.id]).toLocaleString('id-ID')}</span></div>
    </div>`).join('');

  $('#sheet').innerHTML = `
    <h3>${esc(toko)}</h3>
    <div class="c">${tgl}<br>No. ${String(nomor).padStart(4,'0')}</div>
    <hr>${baris}<hr>
    <div class="r"><b>TOTAL</b><b>${rp(t)}</b></div>
    <div class="r"><span>Tunai</span><span>${rp(bayar)}</span></div>
    <div class="r"><span>Kembali</span><span>${rp(bayar - t)}</span></div>
    <hr><div class="c">Terima kasih, sampai jumpa lagi!</div>`;
  $('#overlay').classList.add('open');
});

$('#btnPrint').addEventListener('click', () => window.print());
$('#btnSelesai').addEventListener('click', () => {
  nomor++; save('kasir_nomor', nomor);
  cart = {}; $('#bayar').value = '';
  $('#overlay').classList.remove('open');
  renderCart();
});

/* ---------- Kelola menu ---------- */
function renderKelola(){
  $('#tabelWrap').innerHTML = menu.length ? `
    <table>
      <thead><tr><th>Nama menu</th><th>Harga (Rp)</th><th></th></tr></thead>
      <tbody>${menu.map(m => `
        <tr>
          <td><input type="text" value="${esc(m.nama)}" data-id="${m.id}" data-f="nama" aria-label="Nama menu"></td>
          <td><input type="number" min="0" step="100" value="${m.harga}" data-id="${m.id}" data-f="harga" aria-label="Harga ${esc(m.nama)}"></td>
          <td><button class="del" data-id="${m.id}">Hapus</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty">Belum ada menu. Isi formulir di atas untuk menambah menu pertama.</div>';
}

function simpanMenu(){ save('kasir_menu', menu); }

$('#formTambah').addEventListener('submit', e => {
  e.preventDefault();
  const nama = $('#nm').value.trim(), harga = Number($('#hg').value);
  if (!nama || isNaN(harga) || harga < 0) return;
  const id = menu.reduce((mx, m) => Math.max(mx, m.id), 0) + 1;
  menu.push({id, nama, harga});
  simpanMenu(); e.target.reset(); $('#nm').focus();
  renderKelola(); renderMenu(); renderCart();
});

$('#tabelWrap').addEventListener('change', e => {
  const i = e.target; if (!i.dataset.f) return;
  const m = menu.find(x => x.id === Number(i.dataset.id)); if (!m) return;
  if (i.dataset.f === 'nama') m.nama = i.value.trim() || m.nama;
  else m.harga = Math.max(0, Number(i.value) || 0);
  simpanMenu(); renderKelola(); renderMenu(); renderCart();
});

$('#tabelWrap').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  const id = Number(b.dataset.id);
  menu = menu.filter(m => m.id !== id); delete cart[id];
  simpanMenu(); renderKelola(); renderMenu(); renderCart();
});

$('#namaToko').addEventListener('input', e => {
  toko = e.target.value.trim() || 'Warung Saya';
  save('kasir_toko', toko);
  $('#judulToko').textContent = toko;
});

/* ---------- Mulai ---------- */
$('#namaToko').value = toko;
$('#judulToko').textContent = toko;
renderMenu(); renderCart(); renderKelola();
</script>
</body>
</html>
